function dec(k,buf){var u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12))}
// Ava P3-4 (2026-10-04): the key is a NON-EXTRACTABLE CryptoKey kept in IndexedDB, never raw bytes in localStorage —
// a script on this origin can use it but cannot read it out. The old raw-key slot is wiped on sight.
try{localStorage.removeItem(OLD)}catch(e){}
function idb(mode,fn){return new Promise(function(res,rej){var o;try{o=indexedDB.open(DB,1)}catch(e){return rej(e)}
  o.onupgradeneeded=function(){o.result.createObjectStore(ST)};o.onerror=function(){rej(o.error)};
  o.onsuccess=function(){var t=o.result.transaction(ST,mode),r=fn(t.objectStore(ST));t.oncomplete=function(){res(r&&r.result)};t.onerror=function(){rej(t.error)}}})}
function keyGet(){return idb('readonly',function(s){return s.get(ID)})}
function keyPut(k){return idb('readwrite',function(s){return s.put(k,ID)}).catch(function(){})}
function keyDel(){return idb('readwrite',function(s){return s.delete(ID)}).catch(function(){})}
function start(k){return dec(k,b64(BLOB)).then(function(html){
  var nf=window.fetch.bind(window);
  // every data/*.json on this site is sealed with the same key: open it transparently, so the page's own code is unchanged
  window.fetch=function(input,init){var url=typeof input==='string'?input:(input&&input.url)||'';
    var u;try{u=new URL(url,location.href)}catch(e){return nf(input,init)}
    if(u.origin!==location.origin||!/\/data\/[^/]+\.json$/.test(u.pathname))return nf(input,init);
    return nf(input,init).then(function(r){if(!r.ok)return r;return r.arrayBuffer().then(function(b){return dec(k,b)}).then(function(p){
      return new Response(p,{status:200,statusText:'OK',headers:{'Content-Type':'application/json'}})})})};
  window.sincaraLock=function(){keyDel().then(function(){location.reload()})};
  var t=new TextDecoder().decode(html);document.open();document.write(t);document.close()})}
function ask(msg){var f=document.getElementById('f');f.hidden=false;document.getElementById('e').textContent=msg||'';document.getElementById('p').focus()}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();var pw=document.getElementById('p').value;document.getElementById('e').textContent='Opening…';
  crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(m){
    return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:hex(SALT),iterations:IT},m,{name:'AES-GCM',length:256},false,['decrypt'])})
   .then(function(k){return dec(k,b64(BLOB).buffer).then(function(){return keyPut(k)}).then(function(){return start(k)})})
   .catch(function(){ask('That password did not work. Try again.')})});
if(!window.crypto||!crypto.subtle){ask('This browser cannot open the page (it needs a secure https connection).');return}
// Ava P3-5: ANY failure on the saved-key path (missing, wrong after a password change, storage blocked) shows the form
keyGet().then(function(k){if(!k)throw 0;return start(k)}).catch(function(){keyDel();ask('')});
